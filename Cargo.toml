[workspace]
resolver = "3"
members = ["crates/jefe-core", "crates/jefe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# acc-ssh (russh) needs 1.89.
rust-version = "1.89"
repository = "https://github.com/lum1n/jefe"
license = "MIT"
publish = false

[workspace.dependencies]
jefe-core = { path = "crates/jefe-core" }
# Pinned: acc is young and moves fast. Bump deliberately; acc calls live in
# jefe-core's worker.rs and merge.rs and jefe's brain.rs only.
acc-core = { git = "https://github.com/lum1n/acc", rev = "22f3466a30a21a75e8a0d7fc7d8906fa9e24ac08" }
acc-ssh = { git = "https://github.com/lum1n/acc", rev = "22f3466a30a21a75e8a0d7fc7d8906fa9e24ac08" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
