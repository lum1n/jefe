[package]
name = "jefe-ffi"
description = "UniFFI bindings (Swift, Kotlin) for jefe-core: drive an orchestrator job from an app over its own transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A plain lib: the app's own staticlib (sessh-swift's `sessh_native`) links
# it beside acc-ffi, so one Rust std and one acc-core are built.
crate-type = ["lib"]
name = "jefe_ffi"

[[bin]]
# `cargo run -p jefe-ffi --features bindgen --bin uniffi-bindgen -- generate ...`
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
acc-core.workspace = true
jefe-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi.workspace = true

[lints]
workspace = true
